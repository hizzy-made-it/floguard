<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F1A" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <!-- Default homepage meta — Seo.jsx overwrites canonical/description per route after hydrate -->
    <link rel="canonical" href="https://floguardfl.com/" />
    <!-- Favicons: Google Search uses a square icon ≥48px (multiples of 48 preferred) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta
      name="description"
      content="Stop flooded yards and foundation moisture in Central Florida. Custom French drains and sump pumps. Free assessments in Daytona, Port Orange, Orlando."
    />
    <meta property="og:site_name" content="FloGuard, LLC" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://floguardfl.com/" />
    <meta property="og:title" content="French Drain & Sump Pump Installation | Central Florida | FloGuard" />
    <meta
      property="og:description"
      content="Stop flooded yards and foundation moisture in Central Florida. Custom French drains and sump pumps. Free assessments in Daytona, Port Orange, Orlando."
    />
    <meta property="og:image" content="https://floguardfl.com/images/hero-poster.jpg" />
    <meta property="og:image:alt" content="FloGuard drainage systems for Central Florida homes" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://floguardfl.com/images/hero-poster.jpg" />

    <!-- LCP: discover hero poster from the initial document (SPA hydrates later) -->
    <link
      rel="preload"
      as="image"
      href="/images/hero-poster.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <link rel="preload" as="image" href="/images/logo.webp" type="image/webp" />

    <!-- Fonts: preconnect + non-blocking stylesheet load (avoids ~1s render-block) -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fewer weights = smaller CSS/font payload; 400/500/600/700 cover body + UI -->
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap" rel="stylesheet" />
      <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>

    <title>French Drain &amp; Sump Pump Installation | Central Florida | FloGuard</title>
    <!-- Organization schema is emitted once per page from React (Seo organizationLd in @graph).
         Do not duplicate LocalBusiness here — duplicate @id confuses parsers. -->
  </head>
  <body>
    <noscript>
      <div style="font-family:system-ui,sans-serif;max-width:40rem;margin:2rem auto;padding:1rem;line-height:1.5">
        <h1>FloGuard, LLC — French drains &amp; sump pumps in Central Florida</h1>
        <p>
          FloGuard designs and installs French drain, sump pump, and yard drainage systems for
          homes in Port Orange, Daytona Beach, Sanford, Orlando, and nearby communities.
          Call <a href="tel:+13862590023">(386) 259-0023</a> for a free on-site assessment.
        </p>
        <ul>
          <li><a href="https://floguardfl.com/services/french-drains">French drain installation</a></li>
          <li><a href="https://floguardfl.com/services/sump-pumps">Sump pump systems</a></li>
          <li><a href="https://floguardfl.com/areas">Service areas</a></li>
          <li><a href="https://floguardfl.com/blog/french-drain-cost-central-florida-2026">2026 cost guide</a></li>
          <li><a href="https://floguardfl.com/contact">Free assessment</a></li>
        </ul>
        <p>Enable JavaScript for the full interactive site experience.</p>
      </div>
    </noscript>
    <div id="root">
      <!-- Static LCP shell: paints before React hydrates; replaced on mount -->
      <img
        src="/images/hero-poster.webp"
        alt=""
        width="1600"
        height="900"
        fetchpriority="high"
        decoding="async"
        style="position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#0B0F1A"
        aria-hidden="true"
      />
    </div>
  </body>
</html>
