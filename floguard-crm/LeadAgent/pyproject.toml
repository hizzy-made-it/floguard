[project]
name = "leadagent"
version = "0.1.0"
description = "FloGuard local drainage / flood-mitigation sales outreach agent — classify, enrich, draft, approve"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.40.0",
    "scrapling[shell]>=0.4.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
leadagent = "leadagent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
