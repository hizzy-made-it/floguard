name: IndexNow ping

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/scripts/indexnow.py"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: floguard-indexnow
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test sitemap and ownership checks
        run: python3 -B .github/scripts/test_indexnow.py
      - name: Verify live sitemap and notify IndexNow
        run: python3 .github/scripts/indexnow.py --attempts 18 --pages --submit
